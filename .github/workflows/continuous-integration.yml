# https://help.github.com/en/categories/automating-your-workflow-with-github-actions

name: "Continuous Integration"

on:
  pull_request:
  push:
    branches:
      - "*.*.x"
      - "release/*.*.x"
      - "renovate/*"

jobs:
  source:
    name: "Source"
    if: ${{ !startsWith(github.ref_name, 'release/') && !startsWith(github.base_ref, 'release/') }}
    uses: "./.github/workflows/ci.yml"

  release:
    name: "Release"
    if: ${{ startsWith(github.ref_name, 'release/') || startsWith(github.base_ref, 'release/') }}
    uses: "./.github/workflows/ci.yml"
    with:
      release: true

  # Pull requests against X.Y.x also get checked the way release/X.Y.x would be after merging
  build-release-tree:
    name: "Build release tree"
    if: ${{ github.event_name == 'pull_request' && !startsWith(github.base_ref, 'release/') }}
    runs-on: "ubuntu-latest"

    steps:
      - name: "Checkout"
        uses: "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1" # v7

      - name: "Install PHP"
        uses: "shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962" # 2.40.0
        with:
          coverage: "none"
          php-version: "8.4"
          extensions: intl, sodium
          ini-values: memory_limit=-1

      - name: "Install dependencies"
        uses: "ramsey/composer-install@65e4f84970763564f46a70b8a54b90d033b3bdda" # 4.0.0
        with:
          dependency-versions: "locked"

      - name: "Install CI dependencies"
        uses: "ramsey/composer-install@65e4f84970763564f46a70b8a54b90d033b3bdda" # 4.0.0
        with:
          dependency-versions: "locked"
          working-directory: "tools"
          custom-cache-suffix: "ci"

      - name: "Build release tree"
        run: build/build-release.sh

      - name: "Pack release tree"
        run: git diff --name-only -z | tar --null -czf release-tree.tgz -T -

      - name: "Upload release tree"
        uses: "actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9" # v7.0.2
        with:
          name: "release-tree"
          path: "release-tree.tgz"
          retention-days: 7

  release-preview:
    name: "Release preview"
    needs: "build-release-tree"
    uses: "./.github/workflows/ci.yml"
    with:
      release: true
      release-tree-artifact: "release-tree"
